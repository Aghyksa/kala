[package]
name = "kala-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = { version = "0.99", features = ["chrono"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
