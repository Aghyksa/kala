[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# rust_xlsxwriter 0.99 needs zip ^8.3; every 8.x on crates.io is yanked (extract-side fixes, Kala only writes).
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }
